create_ticket:
  name: Ticket aanmaken
  description: Maak een nieuw ticket aan in het hotel ticket systeem. Geschikt voor gebruik in automaties.
  fields:
    title:
      name: Titel
      description: Korte omschrijving van het ticket
      required: true
      example: "Kraan lekt in kamer 204"
      selector:
        text:
    category:
      name: Categorie
      description: Afdeling waarvoor het ticket bedoeld is
      required: true
      example: "technical"
      selector:
        select:
          options:
            - label: "Technische dienst"
              value: "technical"
            - label: "Huishouding"
              value: "housekeeping"
            - label: "Receptie"
              value: "reception"
    description:
      name: Beschrijving
      description: Optionele uitgebreide beschrijving
      required: false
      example: "De kraan in de badkamer druppelt continu"
      selector:
        text:
          multiline: true
    priority:
      name: Prioriteit
      description: Urgentie van het ticket
      required: false
      default: "medium"
      selector:
        select:
          options:
            - label: "Laag"
              value: "low"
            - label: "Normaal"
              value: "medium"
            - label: "Hoog"
              value: "high"
            - label: "Urgent"
              value: "urgent"
    location:
      name: Locatie
      description: HA area_id van de kamer of zone (optioneel)
      required: false
      example: "kamer_204"
      selector:
        area:
    assigned_to:
      name: Toegewezen aan
      description: HA user_id van de medewerker (optioneel)
      required: false
      selector:
        text:
