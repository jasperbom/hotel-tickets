name: "Hotel Ticket System"
version: "1.3.56"
slug: "hotel_tickets"
description: "Ticket en taakbeheer voor hotels – technische dienst, huishouding en receptie"
url: "https://github.com/jasperbom/hotel-tickets"
arch:
  - aarch64
  - amd64
  - armv7
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8080
panel_icon: mdi:ticket-outline
panel_title: Tickets
homeassistant_api: true
auth_api: true
options:
  smtp_enabled: false
  log_level: "info"
schema:
  smtp_enabled: bool
  smtp_host: str?
  smtp_port: int?
  smtp_user: str?
  smtp_password: str?
  smtp_from: str?
  log_level: list(debug|info|warning|error)
map:
  - data:rw
  - config:rw
