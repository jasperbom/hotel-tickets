name: "Hotel Ticket System (Beta)"
version: "0.0.0"  # wordt door scripts/sync-beta.sh gelijkgetrokken met productie
slug: "hotel_tickets_beta"
description: "Testomgeving van het Hotel Ticket System — eigen database, kopieerbare productiedata, geen meldingen"
url: "https://github.com/jasperbom/hotel-tickets"
arch:
  - aarch64
  - amd64
  - armv7
init: false
startup: application
boot: manual
ingress: true
ingress_port: 8080
ports:
  8081/tcp: null
  8444/tcp: null
ports_description:
  8081/tcp: "Directe HTTP-toegang tot de beta op het LAN. Leeg laten = uitgeschakeld."
  8444/tcp: "HTTPS-toegang tot de beta op het LAN. Vereist ssl: true en een certificaat in /ssl."
panel_icon: mdi:flask-outline
panel_title: Tickets β
homeassistant_api: true
auth_api: true
# Zelfde rechten als productie, zodat inloggen en wachtwoord wijzigen ook in de
# testomgeving werken.
hassio_api: true
hassio_role: admin
options:
  smtp_enabled: false
  log_level: "info"
  claude_model: "claude-haiku-4-5"
  allowed_networks: []
  session_hours: 720
  ssl: false
  certfile: "fullchain.pem"
  keyfile: "privkey.pem"
schema:
  smtp_enabled: bool
  smtp_host: str?
  smtp_port: int?
  smtp_user: str?
  smtp_password: str?
  smtp_from: str?
  log_level: list(debug|info|warning|error)
  claude_api_key: str?
  claude_model: str?
  allowed_networks:
    - str
  session_hours: int(1,8760)?
  ssl: bool
  certfile: str?
  keyfile: str?
map:
  - data:rw
  - config:rw
  - ssl:ro
